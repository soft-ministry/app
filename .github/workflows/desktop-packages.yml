name: Build desktop packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare application version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - name: Set application version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "app_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "app_version=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    name: Build macOS DMG
    needs: prepare
    runs-on: macos-15
    env:
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Set application version
        run: node packaging/set-frontend-version.mjs "${{ needs.prepare.outputs.app_version }}"

      - name: Build macOS package
        run: ./packaging/build-macos-dmg.sh
        env:
          APP_VERSION: ${{ env.APP_VERSION }}

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ModernControl-macos-arm64-${{ needs.prepare.outputs.app_version }}
          path: |
            packaging/dist/*.dmg
            packaging/dist/*-macOS.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows EXE
    needs: prepare
    runs-on: windows-2022
    env:
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Set application version
        shell: pwsh
        run: node packaging/set-frontend-version.mjs "${{ needs.prepare.outputs.app_version }}"

      - name: Verify packaging tools
        shell: pwsh
        run: |
          Get-Command mvn
          Get-Command jpackage
          Get-Command candle.exe
          Get-Command light.exe

      - name: Build Windows executable
        shell: pwsh
        run: .\packaging\build-windows-exe.ps1 -AppVersion "${{ env.APP_VERSION }}"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ModernMinistry-windows-${{ needs.prepare.outputs.app_version }}
          path: packaging/dist/*.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: Modern*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "Modern Ministry $GITHUB_REF_NAME" \
              --generate-notes
          fi
