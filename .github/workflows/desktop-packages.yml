name: Build desktop packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Set application version
        run: node packaging/set-frontend-version.mjs "${{ env.APP_VERSION }}"

      - name: Build macOS package
        run: ./packaging/build-macos-dmg.sh
        env:
          APP_VERSION: ${{ env.APP_VERSION }}

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ModernControl-macos-arm64-${{ env.APP_VERSION }}
          path: |
            packaging/dist/*.dmg
            packaging/dist/*-macOS.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows EXE
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Set application version
        shell: pwsh
        run: node packaging/set-frontend-version.mjs "${{ env.APP_VERSION }}"

      - name: Verify packaging tools
        shell: pwsh
        run: |
          Get-Command mvn
          Get-Command jpackage
          Get-Command candle.exe
          Get-Command light.exe

      - name: Build Windows executable
        shell: pwsh
        run: .\packaging\build-windows-exe.ps1 -AppVersion "${{ env.APP_VERSION }}"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ModernMinistry-windows-${{ env.APP_VERSION }}
          path: packaging/dist/*.exe
          if-no-files-found: error
